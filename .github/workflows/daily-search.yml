name: Daily job search

on:
  schedule:
    - cron: '0 5 * * *'   # 05:00 UTC = 07:00 SAST — runs every day automatically
  workflow_dispatch: {}     # also lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated seen_jobs.json back

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scheduled search
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: python scheduled_search.py

      - name: Commit updated seen-jobs list
        run: |
          git config user.name "jobpilot-bot"
          git config user.email "actions@github.com"
          git add seen_jobs.json
          git diff --staged --quiet || git commit -m "Update seen jobs [automated]"
          git push
